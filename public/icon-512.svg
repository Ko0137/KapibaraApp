<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" opacity="0.9"/>
  <!-- Central Mega Tap Capybara / Hand / Crown Icon -->
  <circle cx="256" cy="256" r="150" fill="#1e1b4b" opacity="0.75" />
  <g filter="url(#glow)">
    <!-- Golden Slipper / Mega Tap Crown -->
    <path d="M190 320 C180 260, 220 200, 256 160 C292 200, 332 260, 322 320 C310 370, 202 370, 190 320 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="8"/>
    <!-- Lightning zap -->
    <polygon points="266,130 240,210 270,210 246,290 286,210 256,210" fill="#ffffff" />
    <!-- Tap ripples -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3" stroke-dasharray="12 12" />
    <circle cx="256" cy="256" r="210" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.4" />
  </g>
  <text x="256" y="420" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">MEGATAP</text>
</svg>
